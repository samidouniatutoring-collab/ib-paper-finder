# Move this file to .github/workflows/deploy.yml in the ib-paper-finder repo.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 1-5" # weekdays after the US close: refresh end-of-day prices
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-of-day prices for the Portfolio app (Google Sheet → history on the data branch)
        run: |
          git fetch origin data --depth=1 2>/dev/null && git show origin/data:history.json > /tmp/history.json 2>/dev/null || echo '{}' > /tmp/history.json
          node scripts/fetch-prices.mjs /tmp/history.json || echo "price fetch failed, continuing"
          mkdir -p /tmp/datab && cd /tmp/datab && git init -q && cp /tmp/history.json . && git add history.json \
            && git -c user.name=prices-bot -c user.email=prices-bot@users.noreply.github.com commit -qm "prices $(date -u +%F)" \
            && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data || echo "history not saved"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
